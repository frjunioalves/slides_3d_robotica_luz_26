<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aula 3D: Monte seu Semáforo com Arduino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf1f7;--ink:#1d2433;--muted:#5b6578;--card:#fff;--line:#dfe6ee;--red:#ff4545;--yel:#ffc300;--grn:#22c55e;--accent:#6c4cf5}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.app{display:flex;flex-direction:column;height:100vh}
header{display:flex;align-items:center;gap:14px;padding:10px 18px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}
.tl{display:flex;flex-direction:column;gap:3px;background:#1d2433;padding:5px 6px;border-radius:8px}
.tl i{width:9px;height:9px;border-radius:50%;display:block}
.tl i:nth-child(1){background:var(--red)}.tl i:nth-child(2){background:var(--yel)}.tl i:nth-child(3){background:var(--grn)}
h1{font-family:'Baloo 2',sans-serif;font-size:22px;margin:0;line-height:1}
h1 small{display:block;font-family:Nunito;font-size:12px;color:var(--muted);font-weight:700;margin-top:3px}
.badge3d{font-family:'Baloo 2';background:linear-gradient(135deg,#6c4cf5,#22b8f0);color:#fff;border-radius:8px;padding:1px 8px;font-size:15px;margin-left:6px;vertical-align:2px}
.dots{display:flex;gap:6px;margin-left:auto;align-items:center;flex-wrap:wrap}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid #c6d0dc;background:#fff;cursor:pointer;padding:0;transition:.2s}
.dot.done{background:#b7c7ff;border-color:#8ea6ff}
.dot.cur{background:var(--accent);border-color:var(--accent);transform:scale(1.3)}
.hbtn{border:none;background:#f0f3f8;border-radius:10px;padding:7px 10px;font-size:15px;cursor:pointer}
.hbtn:hover{background:#e2e8f2}
main{flex:1;display:grid;grid-template-columns:1fr 410px;min-height:0}
.stage{position:relative;margin:14px;border-radius:20px;overflow:hidden;background:#0f1622}
.stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.stage canvas.dragging{cursor:grabbing}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;font-weight:800;font-size:13px;padding:5px 11px;border-radius:999px;background:#fff;color:#1d2433;box-shadow:0 4px 14px rgba(0,0,0,.35);transform:translate(-50%,calc(-100% - 16px))}
.lbl::after{content:'';position:absolute;left:50%;top:100%;width:2px;height:16px;background:rgba(255,255,255,.85);transform:translateX(-50%)}
.lbl.l{transform:translate(calc(-100% - 22px),-50%)}
.lbl.l::after{left:100%;top:50%;width:22px;height:2px;transform:translateY(-50%)}
.lbl.r{transform:translate(22px,-50%)}
.lbl.r::after{left:auto;right:100%;top:50%;width:22px;height:2px;transform:translateY(-50%)}
.lbl.blue{background:#dbe7ff;color:#1c4fb8}.lbl.red{background:#ffe0e0;color:#b3261e}.lbl.yel{background:#fff7d6;color:#7a5b00}.lbl.dark{background:#1d2433;color:#fff}.lbl.green{background:#dcfce7;color:#0f5e28}
.zoom{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:44px;height:44px;border-radius:12px;border:none;background:rgba(255,255,255,.95);font-size:20px;font-weight:800;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.25);color:#1d2433}
.zoom button:hover{background:#fff;transform:scale(1.06)}
.zoom button.on{background:#6c4cf5;color:#fff}
.hint{position:absolute;left:14px;top:14px;background:rgba(255,255,255,.12);color:#dfe8f5;font-size:13px;font-weight:700;padding:8px 12px;border-radius:12px;backdrop-filter:blur(4px);transition:opacity .6s;pointer-events:none;max-width:calc(100% - 28px)}
.toast{position:absolute;left:50%;top:16px;transform:translate(-50%,-20px);background:#fff;color:#1d2433;font-weight:800;padding:9px 16px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.3);opacity:0;transition:.35s;pointer-events:none;white-space:nowrap;font-size:14px}
.toast.show{opacity:1;transform:translate(-50%,0)}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#cfe0f5;font-weight:800;font-size:18px}
.panel{margin:14px 14px 14px 0;background:var(--card);border-radius:20px;display:flex;flex-direction:column;min-height:0;box-shadow:0 2px 0 var(--line)}
.content{flex:1;overflow:auto;padding:22px 22px 10px}
.chip{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:#efeaff;color:var(--accent)}
.content h2{font-family:'Baloo 2',sans-serif;font-size:27px;line-height:1.1;margin:10px 0 10px}
.content p{font-size:16px;line-height:1.5;margin:0 0 12px}
.content ul{padding-left:20px;margin:0 0 12px}
.content li{font-size:15.5px;line-height:1.45;margin-bottom:6px}
.box{border-radius:14px;padding:12px 14px;margin:12px 0;font-size:14.5px;line-height:1.45}
.tip{background:#fff7d6;border:1px solid #f3e19a}.warn{background:#ffe9e9;border:1px solid #ffc6c6}.fun{background:#e6f6ff;border:1px solid #bfe3fa}
.box b:first-child{display:block;margin-bottom:3px}
.mats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 12px}
.mat{background:#f5f7fb;border:1px solid var(--line);border-radius:12px;padding:9px 10px;font-size:13.5px;font-weight:700;display:flex;gap:8px;align-items:center}
.mat span{font-size:20px}
.where{display:inline-block;background:#1d2433;color:#fff;border-radius:8px;padding:1px 7px;font-weight:800;font-size:14px}
.btn{border:none;border-radius:12px;padding:10px 14px;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit;background:#eef1f6;color:#1d2433}
.btn:hover{filter:brightness(.96)}
.btn.primary{background:var(--accent);color:#fff}
.btn.on{background:#1d2433;color:#fff}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
nav{display:flex;align-items:center;gap:10px;padding:14px 18px;border-top:1px solid var(--line)}
nav .btn{padding:12px 18px;font-size:16px}
nav .next{margin-left:auto;background:var(--accent);color:#fff}
nav .next:disabled,nav .prev:disabled{opacity:.35;cursor:default}
nav .count{font-weight:800;color:var(--muted);font-size:14px}
.code{background:#141b26;color:#e6edf7;border-radius:14px;padding:10px 0;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.55;margin:10px 0;overflow:auto}
.ln{padding:0 12px;white-space:pre;cursor:pointer;border-left:3px solid transparent}
.ln:hover{background:#1f2a3a}.ln.sel{background:#2b2558;border-left-color:#a58bff}.ln.run{background:#14361f;border-left-color:#4ade80}
.ln .k{color:#ff8fb1}.ln .f{color:#7cc7ff}.ln .c{color:#ffd166}.ln .n{color:#c3a6ff}.ln .cm{color:#7d8aa0;font-style:italic}
.explain{background:#f3efff;border:1px solid #ddd2ff;border-radius:12px;padding:10px 12px;font-size:14.5px;min-height:46px}
.check label{display:flex;gap:10px;align-items:flex-start;font-size:15px;padding:7px 0;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--grn);flex:none;margin-top:1px}
.status{display:flex;align-items:center;gap:12px;background:#141b26;color:#fff;border-radius:14px;padding:12px 14px;margin:10px 0}
.mini{display:flex;flex-direction:column;gap:4px;background:#000;padding:6px;border-radius:10px}
.mini i{width:16px;height:16px;border-radius:50%;background:#333;display:block;transition:.15s}
.mini i.r.on{background:var(--red);box-shadow:0 0 12px var(--red)}.mini i.y.on{background:var(--yel);box-shadow:0 0 12px var(--yel)}.mini i.g.on{background:var(--grn);box-shadow:0 0 12px var(--grn)}
.status .txt{font-weight:800;font-size:16px}.status .sub{font-size:13px;color:#9fb0c8}
.q{border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.q p{font-weight:800;margin-bottom:8px;font-size:15.5px}
.q button{display:block;width:100%;text-align:left;margin:5px 0;border:2px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-family:inherit;font-size:14.5px;cursor:pointer}
.q button:hover{border-color:#b9c4d4}.q button.ok{border-color:var(--grn);background:#e9fbef}.q button.no{border-color:#ff8a8a;background:#fff0f0}
.q .fb{font-size:14px;margin-top:6px;color:var(--muted)}
.score{font-weight:800;font-size:16px;margin:8px 0}
@media (max-width:920px){
  .app{height:auto;min-height:100vh}
  main{grid-template-columns:1fr;grid-template-rows:58vh auto}
  .stage{margin:10px}.panel{margin:0 10px 10px}.content{overflow:visible}
  .dots{margin-left:0;width:100%}h1{font-size:19px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo"><div class="tl"><i></i><i></i><i></i></div>
      <h1>Monte seu Semáforo com Arduino <span class="badge3d">3D</span><small>Aula passo a passo · protoboard média (400 furos)</small></h1></div>
    <div class="dots" id="dots"></div>
    <button class="hbtn" id="snd" title="Som">🔊</button>
    <button class="hbtn" id="fs" title="Tela cheia">⛶</button>
  </header>
  <main>
    <div class="stage" id="stage">
      <div class="loading" id="loading">Carregando a bancada 3D…</div>
      <div id="labels"></div>
      <div class="hint" id="hint">✋ Arraste para girar · 🖱️ role para zoom · botão direito (ou 2 dedos) move · 👆 toque nos furos</div>
      <div class="toast" id="toast"></div>
      <div class="zoom">
        <button id="zin" title="Aproximar">+</button>
        <button id="zout" title="Afastar">−</button>
        <button id="ztop" title="Vista de cima">⬇</button>
        <button id="zfocus" title="Focar na peça">🎯</button>
        <button id="zrot" title="Girar sozinho">⟳</button>
      </div>
    </div>
    <aside class="panel">
      <div class="content" id="content"></div>
      <nav>
        <button class="btn prev" id="prev">◀ Voltar</button>
        <span class="count" id="count"></span>
        <button class="btn next" id="next">Próximo ▶</button>
      </nav>
    </aside>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(async function(){
if(!window.THREE){ document.getElementById('loading').textContent='Não foi possível carregar o 3D. Verifique a internet e recarregue.'; return; }
try{ await Promise.race([document.fonts.ready, new Promise(r=>setTimeout(r,1500))]); }catch(e){}
const T=THREE, V=(x,y,z)=>new T.Vector3(x,y,z);

/* ============ GEOMETRIA (mesma da versão 2D: 20 px = 1 unidade) ============ */
const X=x=>(x-825)/20, Z=y=>(y-330)/20;
const cx2d=c=>530+(c-1)*20, col=c=>X(cx2d(c));
const ROWZ={j:-5.5,i:-4.5,h:-3.5,g:-2.5,f:-1.5,e:.5,d:1.5,c:2.5,b:3.5,a:4.5};
const RAILZ={tm:-8.5,tp:-7.5,bm:7,bp:8};
const TOP=0.8;
const RAILCOLS=[]; [[2,6],[8,12],[14,18],[20,24],[26,30]].forEach(([a,b])=>{for(let c=a;c<=b;c++)RAILCOLS.push(c)});
const LEDS={R:{ax:col(8), pin:X(320), cz:Z(110), name:'vermelho', on:0xff3030, off:0x8a1616, hex:'#c81414', dark:0x6a0c0c},
            Y:{ax:col(15),pin:X(304), cz:Z(90),  name:'amarelo',  on:0xffc400, off:0x7d5e08, hex:'#d9a400', dark:0x6a5000},
            G:{ax:col(22),pin:X(288), cz:Z(70),  name:'verde',    on:0x18e85c, off:0x0f5a2c, hex:'#0c8a36', dark:0x0a3d1c}};
const PINZ=Z(212), GNDP={x:X(240),z:Z(468)}, GNDR={x:col(3),z:RAILZ.bm};

/* ============ CENA ============ */
const stage=document.getElementById('stage');
const renderer=new T.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=T.PCFSoftShadowMap;
renderer.outputEncoding=T.sRGBEncoding; renderer.toneMapping=T.ACESFilmicToneMapping; renderer.toneMappingExposure=0.92;
stage.insertBefore(renderer.domElement, stage.firstChild);
document.getElementById('loading').remove();
const canvas=renderer.domElement;
const scene=new T.Scene(); scene.background=new T.Color(0x0f1622); scene.fog=new T.Fog(0x0f1622,90,190);
const camera=new T.PerspectiveCamera(40,1,0.1,500);
scene.add(new T.HemisphereLight(0xffffff,0x2a3548,0.75));
const sun=new T.DirectionalLight(0xffffff,0.95); sun.position.set(-18,42,26); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048); Object.assign(sun.shadow.camera,{left:-50,right:30,top:25,bottom:-25,near:1,far:120}); sun.shadow.bias=-0.0005;
scene.add(sun); scene.add(new T.AmbientLight(0xffffff,0.15));

function canvasTex(w,h,draw,repeat){
  const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d'); draw(g,w,h);
  const t=new T.CanvasTexture(c); t.encoding=T.sRGBEncoding; t.anisotropy=renderer.capabilities.getMaxAnisotropy();
  if(repeat){ t.wrapS=t.wrapT=T.RepeatWrapping; t.repeat.set(repeat,repeat); }
  return t;
}
// tapete de corte
const matTex=canvasTex(256,256,(g,w,h)=>{ g.fillStyle='#16233a'; g.fillRect(0,0,w,h); g.strokeStyle='#22334f'; g.lineWidth=2;
  for(let i=0;i<=w;i+=64){ g.beginPath(); g.moveTo(i,0); g.lineTo(i,h); g.stroke(); g.beginPath(); g.moveTo(0,i); g.lineTo(w,i); g.stroke(); } },40);
const floor=new T.Mesh(new T.PlaneGeometry(400,400), new T.MeshStandardMaterial({map:matTex,roughness:.95}));
floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);

const std=(color,o={})=>new T.MeshStandardMaterial(Object.assign({color,roughness:.6,metalness:0},o));
const metal=std(0xc4c9d0,{metalness:.85,roughness:.3});
function box(w,h,d,mat,x,y,z,parent){ const m=new T.Mesh(new T.BoxGeometry(w,h,d),mat); m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; (parent||scene).add(m); return m; }
function cyl(r,h,mat,x,y,z,parent,seg=24){ const m=new T.Mesh(new T.CylinderGeometry(r,r,h,seg),mat); m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; (parent||scene).add(m); return m; }
function polyTube(pts,r,mat,parent,seg){ const path=new T.CurvePath(); for(let i=0;i<pts.length-1;i++) path.add(new T.LineCurve3(pts[i],pts[i+1]));
  const m=new T.Mesh(new T.TubeGeometry(path,seg||pts.length*10,r,8,false),mat); m.castShadow=true; (parent||scene).add(m); return m; }

/* ============ PROTOBOARD ============ */
const HOLES=[];
for(let c=1;c<=30;c++) for(const r in ROWZ) HOLES.push({x:col(c),z:ROWZ[r],g:'c'+c+('abcde'.includes(r)?'B':'T'),c});
for(const k in RAILZ) RAILCOLS.forEach(c=>HOLES.push({x:col(c),z:RAILZ[k],g:'r'+k}));
const boardTex=canvasTex(2600,1520,(g)=>{
  const k=4, P=(x,y)=>[(x-500)*k,(y-135)*k];
  g.fillStyle='#f4f1ea'; g.fillRect(0,0,2600,1520);
  g.fillStyle='#e1dccf'; g.fillRect(...P(506,313),638*k,14*k);
  const line=(y,c)=>{ g.strokeStyle=c; g.lineWidth=10; g.beginPath(); g.moveTo(...P(522,y)); g.lineTo(...P(1128,y)); g.stroke(); };
  line(147,'#2f6fde'); line(193,'#e53935'); line(457,'#2f6fde'); line(503,'#e53935');
  g.textAlign='center'; g.textBaseline='middle';
  const lab=(x,y,t,c,fs,w)=>{ g.fillStyle=c; g.font=`${w||800} ${fs*k}px Nunito, Arial`; g.fillText(t,...P(x,y)); };
  [[160,'−','#2f6fde'],[180,'+','#e53935'],[470,'−','#2f6fde'],[490,'+','#e53935']].forEach(([y,t,c])=>{ lab(512,y,t,c,15); lab(1138,y,t,c,15); });
  const RY={j:220,i:240,h:260,g:280,f:300,e:340,d:360,c:380,b:400,a:420};
  for(const r in RY){ lab(513,RY[r],r,'#8b8577',10); lab(1137,RY[r],r,'#8b8577',10); }
  for(let c=1;c<=30;c++){ if(c===1||c%5===0){ lab(cx2d(c),207,c,'#9a937f',9); lab(cx2d(c),438,c,'#9a937f',9); } }
  HOLES.forEach(h=>{ const [px,py]=[(h.x*20+825-500)*k,(h.z*20+330-135)*k];
    g.fillStyle='#2f3136'; g.beginPath(); g.roundRect?g.roundRect(px-19,py-19,38,38,7):g.rect(px-19,py-19,38,38); g.fill();
    g.fillStyle='#17181b'; g.fillRect(px-11,py-11,22,22); });
});
const boardSide=std(0xe9e4d6,{roughness:.8}), boardTop=std(0xffffff,{map:boardTex,roughness:.75});
const boardMats=[boardSide,boardSide,boardTop,boardSide,boardSide,boardSide];
const pBoard=new T.Group(); scene.add(pBoard);
const boardMesh=new T.Mesh(new T.BoxGeometry(32.5,0.8,19),boardMats); boardMesh.position.set(0,0.4,-0.25); boardMesh.castShadow=boardMesh.receiveShadow=true; pBoard.add(boardMesh);
// raio-x
const xray=new T.Group(); pBoard.add(xray); xray.visible=false;
const gold=std(0xd9a521,{metalness:.8,roughness:.35,emissive:0x3a2a00});
for(let c=1;c<=30;c++){ box(.55,.12,4.8,gold,col(c),.45,-3.5,xray); box(.55,.12,4.8,gold,col(c),.45,2.5,xray); }
const rmin=col(2)-.4, rmax=col(30)+.4;
[[RAILZ.tm,0x5b8cff],[RAILZ.tp,0xff6b6b],[RAILZ.bm,0x5b8cff],[RAILZ.bp,0xff6b6b]].forEach(([z,c])=>box(rmax-rmin,.12,.55,std(c,{metalness:.6,roughness:.4,emissive:c,emissiveIntensity:.25}),(rmin+rmax)/2,.45,z,xray));
function setXray(on){ xray.visible=on; boardMats.forEach(m=>{ m.transparent=on; m.opacity=on?.28:1; m.depthWrite=!on; m.needsUpdate=true; }); }

/* ============ ARDUINO ============ */
const pArd=new T.Group(); scene.add(pArd);
const TOP1=['AREF','GND','13','12','~11','~10','~9','8'], TOP2=['7','~6','~5','4','~3','2','TX 1','RX 0'];
const BOT1=['IOREF','RESET','3.3V','5V','GND','GND','Vin'], BOT2=['A0','A1','A2','A3','A4','A5'];
const pcbTex=canvasTex(1600,1160,(g)=>{
  const k=4,P=(x,y)=>[(x-40)*k,(y-195)*k];
  g.fillStyle='#0a7f8f'; g.fillRect(0,0,1600,1160);
  g.strokeStyle='rgba(255,255,255,.08)'; g.lineWidth=6; for(let i=0;i<12;i++){ g.beginPath(); g.moveTo(...P(180+i*14,250)); g.lineTo(...P(200+i*14,340)); g.stroke(); }
  g.fillStyle='#fff'; g.textAlign='center'; g.textBaseline='middle';
  const t=(x,y,s,fs,rot,align)=>{ g.save(); g.translate(...P(x,y)); if(rot) g.rotate(rot); g.textAlign=align||'center'; g.font=`800 ${fs*k}px Nunito, Arial`; g.fillText(s,0,0); g.restore(); };
  t(300,312,'ARDUINO UNO',22); t(344,270,'DIGITAL (PWM ~)',8.5); t(228,430,'POWER',8.5); t(344,430,'ANALOG IN',8.5);
  TOP1.forEach((s,i)=>t(152+i*16,226,s,7,-Math.PI/2,'right')); TOP2.forEach((s,i)=>t(288+i*16,226,s,7,-Math.PI/2,'right'));
  BOT1.forEach((s,i)=>t(176+i*16,454,s,7,-Math.PI/2,'left')); BOT2.forEach((s,i)=>t(304+i*16,454,s,7,-Math.PI/2,'left'));
  [['L',250,'#f6d365'],['TX',263,'#f6d365'],['RX',276,'#f6d365']].forEach(([s,y,c])=>{ g.fillStyle=c; g.fillRect(...P(150,y),12*k,7*k); g.fillStyle='#fff'; t(172,y+3.5,s,7); });
  g.fillStyle='#7CFC9A'; g.fillRect(...P(392,282),12*k,7*k); g.fillStyle='#fff'; t(412,286,'ON',7);
  t(109,240,'RESET',7);
  [[425,246],[425,442],[118,470]].forEach(([x,y])=>{ g.fillStyle='#e8eef2'; g.beginPath(); g.arc(...P(x,y),7*k,0,7); g.fill(); g.fillStyle='#0a7f8f'; g.beginPath(); g.arc(...P(x,y),4*k,0,7); g.fill(); });
  g.strokeStyle='rgba(255,255,255,.6)'; g.lineWidth=5; g.strokeRect(...P(210,356),210*k,50*k);
});

  for(let i=1;i<pts.length;i++){ const a=pts[i-1], b=pts[i], d=a.distanceTo(b); let t=step-acc;
    while(t<=d){ out.push(a.clone().lerp(b,t/d)); t+=step; } acc=d-(t-step); }
  return out; }

const orb={target:V(-10,0,0),dist:52,theta:-.35,phi:.92};

function applyCam(){ const s=Math.sin(orb.phi); camera.position.set(orb.target.x+orb.dist*s*Math.sin(orb.theta), orb.target.y+orb.dist*Math.cos(orb.phi), orb.target.z+orb.dist*s*Math.cos(orb.theta)); camera.lookAt(orb.target); }
function flyTo(v,ms=1100){ const from={t:orb.target.clone(),d:orb.dist,th:orb.theta,ph:orb.phi};
  let th=v.theta; while(th-from.th>Math.PI) th-=2*Math.PI; while(th-from.th<-Math.PI) th+=2*Math.PI;
  camTween={from,to:{t:V(...v.t),d:v.d,th,ph:v.phi},t0:performance.now(),ms}; }

const ptrs=new Map(); let mode=null, moved=0, pinchD=0, downPt=null;

canvas.addEventListener('pointerdown',e=>{ canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  camTween=null; moved=0; downPt={x:e.clientX,y:e.clientY}; mode=(e.button===2||e.shiftKey)?'pan':'rot';
  if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinchD=Math.hypot(a.x-b.x,a.y-b.y); mode='pinch'; }
  canvas.classList.add('dragging'); lastUser=performance.now(); });
function pan(dx,dy){ const k=orb.dist*0.0016; const right=V(Math.cos(orb.theta),0,-Math.sin(orb.theta)); const fwd=V(-Math.sin(orb.theta),0,-Math.cos(orb.theta));
  orb.target.addScaledVector(right,-dx*k).addScaledVector(fwd,dy*k); clampTarget(); }
function clampTarget(){ orb.target.x=Math.max(-45,Math.min(25,orb.target.x)); orb.target.z=Math.max(-20,Math.min(20,orb.target.z)); orb.target.y=Math.max(0,Math.min(6,orb.target.y)); }

  const dx=c.x-p.x, dy=c.y-p.y; moved+=Math.abs(dx)+Math.abs(dy); lastUser=performance.now();
  if(moved>4) hideHint();

  else if(mode==='pan') pan(dx,dy);

});

const ray=new T.Raycaster(), hlGroup=new T.Group(); scene.add(hlGroup); let hlTimer;
const hlMat=new T.MeshBasicMaterial({color:0xffd000});
function pick(cxp,cyp){
  if(step===0||!pBoard.visible) return;
  const r=canvas.getBoundingClientRect(); ray.setFromCamera({x:(cxp-r.left)/r.width*2-1,y:-(cyp-r.top)/r.height*2+1},camera);
  const hit=ray.intersectObject(boardMesh)[0]; if(!hit||hit.point.y<TOP-.05) return;
  let best=null,bd=.45; HOLES.forEach(h=>{ const d=Math.hypot(h.x-hit.point.x,h.z-hit.point.z); if(d<bd){bd=d;best=h;} }); if(!best) return;
  hlGroup.clear(); const list=HOLES.filter(h=>h.g===best.g);
  list.forEach(h=>{ const m=new T.Mesh(new T.BoxGeometry(.5,.08,.5),hlMat); m.position.set(h.x,TOP+.05,h.z); hlGroup.add(m); });
  toast(best.g[0]==='r' ? ((best.g.endsWith('m')?'Trilho − (azul)':'Trilho + (vermelho)')+`: todos os ${list.length} furos estão ligados!`) : `Coluna ${best.c}: estes 5 furos estão ligados por baixo ⚡`);
  clickSound(900); clearTimeout(hlTimer); hlTimer=setTimeout(()=>hlGroup.clear(),3500);
}

const CODE=[

 ['int vermelho = 5;','Cria uma variável (uma "caixinha") chamada vermelho que guarda o número 5 — o pino do LED vermelho.'],

 ['  pinMode(vermelho, OUTPUT);','Avisa que o pino do vermelho é uma SAÍDA (OUTPUT): o Arduino vai mandar energia por ele.'],
 ['  pinMode(amarelo, OUTPUT);','O pino do amarelo também é saída.'],
 ['  pinMode(verde, OUTPUT);','E o pino do verde também.'],
 ['}','Fim do setup.'],
 ['',''],
 ['void loop() {','loop() repete para sempre: quando chega no fim, volta para o começo.'],
 ['  digitalWrite(verde, HIGH);','HIGH = ligar. O pino 7 recebe 5 volts e o LED verde acende: pode passar!'],
 ['  delay(3000);','Espera 3000 milissegundos. Como 1000 ms = 1 segundo, isso dá 3 segundos.'],
 ['  digitalWrite(verde, LOW);','LOW = desligar. O verde apaga.'],
 ['  digitalWrite(amarelo, HIGH);','Acende o amarelo: atenção!'],
 ['  delay(1000);','Espera 1 segundo.'],
 ['  digitalWrite(amarelo, LOW);','Apaga o amarelo.'],
 ['  digitalWrite(vermelho, HIGH);','Acende o vermelho: pare!'],
 ['  delay(3000);','Espera 3 segundos.'],
 ['  digitalWrite(vermelho, LOW);','Apaga o vermelho. Depois disso o loop recomeça e o verde acende de novo.'],
 ['}','Fim do loop… e tudo começa outra vez!'],
];
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function hl(line){ let code=line,cm=''; const i=line.indexOf('//'); if(i>=0){code=line.slice(0,i);cm=line.slice(i);}
  code=esc(code).replace(/\b(void|int)\b|\b(pinMode|digitalWrite|delay|setup|loop)\b|\b(HIGH|LOW|OUTPUT)\b|\b(\d+)\b/g,(m,a,b,c)=>a?`<span class="k">${m}</span>`:b?`<span class="f">${m}</span>`:c?`<span class="c">${m}</span>`:`<span class="n">${m}</span>`);
  return code+(cm?`<span class="cm">${esc(cm)}</span>`:''); }
const codeBlock=()=>`<div class="code" id="code">${CODE.map((l,i)=>`<div class="ln" data-i="${i}">${hl(l[0])||' '}</div>`).join('')}</div>`;
const CODE_TEXT=CODE.map(l=>l[0]).join('\n');
function bindCode(id){ document.querySelectorAll('#code .ln').forEach(el=>el.onclick=()=>{ const i=+el.dataset.i; if(!CODE[i][1]) return;
  document.querySelectorAll('#code .ln.sel').forEach(x=>x.classList.remove('sel')); el.classList.add('sel');
  document.getElementById(id).innerHTML=`<b>${esc(CODE[i][0].trim())}</b><br>${CODE[i][1]}`; }); }
function bindCopy(){ const b=document.getElementById('copy'); if(!b) return; b.onclick=()=>{ try{ navigator.clipboard.writeText(CODE_TEXT).then(()=>b.textContent='✅ Copiado!',()=>b.textContent='Selecione o código e copie'); }catch(e){ b.textContent='Selecione o código e copie'; } }; }

/* ============ NAVEGAÇÃO ============ */
let step=-1;
const dots=document.getElementById('dots');
dots.innerHTML=STEPS.map((s,i)=>`<button class="dot" data-i="${i}" title="${s.title.replace(/"/g,'')}"></button>`).join('');
dots.querySelectorAll('.dot').forEach(d=>d.onclick=()=>go(+d.dataset.i));
document.getElementById('prev').onclick=()=>go(step-1);
document.getElementById('next').onclick=()=>go(step+1);
document.addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT') return; if(e.key==='ArrowRight') go(step+1); if(e.key==='ArrowLeft') go(step-1); });
function go(n){
  if(n<0||n>=STEPS.length||n===step) return;
  const first=step<0; if(!first && STEPS[step].leave) STEPS[step].leave();
  const dir=first?0:(n>step?1:-1); step=n;
  anims.length=0; hlGroup.clear();
  PIECES.forEach(p=>{ resetPiece(p);
    if(step===0) return;
    if(p.step>step){ p.obj.visible=false; return; }
    if(p.step===step && dir===1) animatePiece(p);
  });
  if(dir===1 && step>=1 && step<=10) setTimeout(()=>toast(step<=2?'✔ Peça colocada na bancada!':'✔ Peça encaixada!'), step>=7?1400:850);
  const st=STEPS[step];
  document.getElementById('content').innerHTML=`<span class="chip">${st.chip}</span><h2>${st.title}</h2>${st.html}`;
  document.getElementById('content').scrollTop=0;
  if(st.enter) st.enter();
  document.getElementById('count').textContent=`${step+1} / ${STEPS.length}`;
  document.getElementById('prev').disabled=step===0;
  const nx=document.getElementById('next'); nx.disabled=step===STEPS.length-1;
  nx.textContent= step===0?'Começar ▶': step===STEPS.length-1?'Fim 🎉':'Próximo ▶';
  dots.querySelectorAll('.dot').forEach((d,i)=>{ d.classList.toggle('cur',i===step); d.classList.toggle('done',i<step); });
  if(first){ const c=st.cam; orb.target.set(...c.t); orb.dist=c.d; orb.theta=c.theta; orb.phi=c.phi; } else flyTo(st.cam);
}

  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(camTween){ const k=Math.min(1,Math.max(0,(now-camTween.t0)/camTween.ms)), e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2, f=camTween.from, t=camTween.to;
    orb.target.lerpVectors(f.t,t.t,e); orb.dist=f.d+(t.d-f.d)*e; orb.theta=f.th+(t.th-f.th)*e; orb.phi=f.ph+(t.ph-f.ph)*e; if(k>=1) camTween=null; }
  if(autoRot && !camTween && now-lastUser>1500) orb.theta+=dt*.18;
  applyCam();
  for(let i=anims.length-1;i>=0;i--){ const a=anims[i], k=(now-a.t0)/a.ms; if(k<0) continue;
    const p=a.p;
    if(a.wire){ const w=wireObj[p.wire]; w.ps.visible=true; const kk=Math.min(1,k); const c=Math.floor(w.count*(1-Math.pow(1-kk,2))/30)*30; w.geo.setDrawRange(0,c);
      if(kk>=1){ w.geo.setDrawRange(0,Infinity); w.pe.visible=true; spark(p.pts); anims.splice(i,1); } }
    else { p.obj.visible=true; const kk=Math.min(1,k); p.obj.position.y=p.h*(1-outBounce(kk));
      if(kk>=1){ p.obj.position.y=0; if(p.pts.length) spark(p.pts); else clickSound(700); anims.splice(i,1); } } }
  for(let i=sparks.length-1;i>=0;i--){ const s=sparks[i], k=(now-s.t0)/650; s.m.scale.setScalar(1+k*5); s.m.material.opacity=1-k; if(k>=1){ scene.remove(s.m); sparks.splice(i,1); } }
  const pul=(now%1300)/1300;
  rings.forEach(r=>{ r.m.visible=r.steps.includes(step); if(r.m.visible){ r.m.scale.setScalar(1+pul*2.6); r.m.material.opacity=1-pul; } });
  annMeshes.forEach(a=>{ a.m.visible=a.steps.includes(step); a.m.material.opacity=.3+.2*Math.sin(now/300); });
  for(const k in flowObj){ const F=flowObj[k]; if(!F.g.visible) continue; const n=F.pts.length, N=F.dots.length, off=Math.floor(now/1000*55);
    F.dots.forEach((d,i)=>{ d.position.copy(F.pts[(off+Math.floor(i*n/N))%n]); }); }
  const r=canvas.getBoundingClientRect();
  LABELS.forEach(l=>{ const show=l.steps.includes(step) && !anims.length; if(!show){ l.el.style.display='none'; return; }
    tmp.copy(l.pos).project(camera); if(tmp.z>1){ l.el.style.display='none'; return; }
    l.el.style.display='block'; l.el.style.left=((tmp.x+1)/2*r.width)+'px'; l.el.style.top=((1-tmp.y)/2*r.height)+'px'; });
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
go(0); requestAnimationFrame(frame);
window.__dbg={go:n=>go(n),orb};
})();
</script>
