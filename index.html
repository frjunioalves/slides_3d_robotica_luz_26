<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aulas de Robótica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf1f7;--ink:#1d2433;--muted:#5b6578;--card:#fff;--line:#dfe6ee;--red:#ff4545;--yel:#ffc300;--grn:#22c55e;--accent:#6c4cf5}
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#fff;border-bottom:1px solid var(--line);padding:18px 16px}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
header .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:0}
.tl{display:flex;flex-direction:column;gap:3px;background:var(--ink);padding:6px 7px;border-radius:9px}
.tl i{width:10px;height:10px;border-radius:50%;display:block}
.tl i:nth-child(1){background:var(--red)}.tl i:nth-child(2){background:var(--yel)}.tl i:nth-child(3){background:var(--grn)}
h1{font-family:'Baloo 2',sans-serif;font-size:28px;margin:0;line-height:1}
h1 small{display:block;font-family:Nunito,sans-serif;font-size:13px;color:var(--muted);font-weight:700;margin-top:4px}
input[type=search]{margin-left:auto;font:inherit;padding:9px 14px;border:1px solid var(--line);border-radius:12px;background:#f6f8fb;min-width:0;width:240px;max-width:100%}
input[type=search]:focus{outline:2px solid var(--accent);outline-offset:1px}
main{padding:24px 0 48px}
.grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{display:flex;flex-direction:column;gap:8px;height:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;color:inherit;text-decoration:none;transition:transform .15s,box-shadow .15s}
.card:hover,.card:focus-visible{transform:translateY(-3px);box-shadow:0 10px 24px rgba(29,36,51,.12);outline:none;border-color:var(--accent)}
.num{font-family:'Baloo 2',sans-serif;font-size:14px;color:#fff;background:linear-gradient(135deg,#6c4cf5,#22b8f0);border-radius:8px;padding:1px 9px;align-self:flex-start}
.card h2{font-family:'Baloo 2',sans-serif;font-size:20px;margin:0;line-height:1.15}
.card p{margin:0;color:var(--muted);font-size:14px;flex:1}
.go{font-weight:800;color:var(--accent);font-size:14px}
.empty{color:var(--muted);text-align:center;padding:40px 0}
@media (max-width:560px){input[type=search]{margin-left:0;width:100%}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="tl" aria-hidden="true"><i></i><i></i><i></i></div>
    <h1>Aulas de Robótica<small>Slides interativos · Luz 2026</small></h1>
    <input type="search" id="q" placeholder="Buscar aula…" aria-label="Buscar aula">
  </div>
</header>
<main class="wrap">
  <ul class="grid" id="grid"></ul>
  <p class="empty" id="empty" hidden>Nenhuma aula encontrada.</p>
</main>
<script>
// Para adicionar uma aula: coloque o .html nesta pasta e acrescente um item aqui.
const AULAS = [
  {
    arquivo: "Aula 3D_ Monte seu Semáforo com Arduino.html",
    titulo: "Monte seu Semáforo com Arduino",
    descricao: "Aula 3D interativa: componentes, montagem e código do semáforo."
  },
];

const grid = document.getElementById('grid');
const empty = document.getElementById('empty');

AULAS.forEach((a, i) => {
  const li = document.createElement('li');
  const link = document.createElement('a');
  link.className = 'card';
  link.href = encodeURI(a.arquivo);
  link.innerHTML = `<span class="num">Aula ${i + 1}</span><h2></h2><p></p><span class="go">Abrir slides →</span>`;
  link.querySelector('h2').textContent = a.titulo;
  link.querySelector('p').textContent = a.descricao || '';
  li.appendChild(link);
  li.dataset.busca = (a.titulo + ' ' + (a.descricao || '')).toLowerCase();
  grid.appendChild(li);
});

document.getElementById('q').addEventListener('input', e => {
  const t = e.target.value.trim().toLowerCase();
  let visiveis = 0;
  for (const li of grid.children) {
    const ok = li.dataset.busca.includes(t);
    li.hidden = !ok;
    if (ok) visiveis++;
  }
  empty.hidden = visiveis > 0;
});
</script>
</body>
</html>
